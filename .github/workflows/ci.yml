name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: PowerShell smoke tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - name: Run smoke tests
        shell: pwsh
        run: ./Tests/Smoke.ps1