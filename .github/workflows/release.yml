name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package distributable
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "universal-cicd"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $items = @("cicd.ps1", "Core", "Modules", "Schemas", "Docs", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "SECURITY.md", "DISTRIBUTION.md")
          foreach ($item in $items) {
            $source = Join-Path $env:GITHUB_WORKSPACE $item
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination $stage -Recurse -Force
            }
          }
          $archive = Join-Path $env:GITHUB_WORKSPACE "universal-cicd-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $checksum = "$hash  $(Split-Path -Leaf $archive)"
          $checksumPath = "$archive.sha256"
          Set-Content -LiteralPath $checksumPath -Value $checksum -Encoding ascii
          "PACKAGE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CHECKSUM=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: universal-cicd-package-${{ github.ref_name }}
          path: |
            ${{ env.PACKAGE }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            ${{ env.PACKAGE }}
            ${{ env.CHECKSUM }}
